<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<!-- meta要素の部品化 -->
	<div th:fragment="meta" th:remove="tag">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	</div>

	<!-- link要素の部品化 -->
	<div th:fragment="styles" th:remove="tag">
		<!-- Bootstrap -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

		<!-- NAGOYAMESHI用の共通スタイルシート -->
		<link th:href="@{/css/style.css}" rel="stylesheet">
	</div>

	<title>部品化用のHTMLファイル</title>
</head>

<body>
	<!-- ヘッダーの部品化（NAGOYAMESHI用に変更） -->
	<div th:fragment="header" th:remove="tag">
		<nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm nagoyameshi-navbar">
			<div class="container nagoyameshi-container">
				<!-- ロゴ画像エリア -->
				<a class="navbar-brand" th:href="@{/}" sec:authorize="!hasRole('ROLE_ADMIN')">
					<img class="nagoyameshi-logo me-1" th:src="@{/storage/logo.png}" alt="NAGOYAMESHI"
						style="height: 80px;">
				</a>
				<a class="navbar-brand" th:href="@{/admin}" sec:authorize="hasRole('ROLE_ADMIN')">
					<img class="nagoyameshi-logo me-1" th:src="@{/storage/logo.png}" alt="NAGOYAMESHI"
						style="height: 80px;">
				</a>

				<!-- スマホなどの画面が小さい時のメニュー -->
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
					data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
					aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>

				<!-- メニューを表示するエリア -->
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<!-- 【左側】既存の店舗メニュー -->
					<ul class="navbar-nav me-auto mb-2 mb-md-0 ms-3" sec:authorize="!hasRole('ROLE_ADMIN')">
						<li class="nav-item">
							<a class="nav-link text-dark fw-bold" th:href="@{/stores}">店舗一覧</a>
						</li>
					</ul>

					<!-- 【右側】ログイン・ユーザー用メニュー -->
					<ul class="navbar-nav ms-auto mb-2 mb-md-0">

						<!-- 【未ログイン状態】誰もログインしていない時に表示 -->
						<li class="nav-item" sec:authorize="isAnonymous()">
							<a class="nav-link text-dark fw-bold" th:href="@{/login}">ログイン</a>
						</li>
						<li class="nav-item" sec:authorize="isAnonymous()">
							<a class="nav-link text-dark fw-bold" th:href="@{/signup}">会員登録</a>
						</li>

						<!-- 【一般ユーザーがログインしている時（無料会員・有料会員共通）】 -->
						<li class="nav-item dropdown" sec:authorize="hasAnyRole('ROLE_FREE', 'ROLE_PREMIUM')">
							<a id="navbarDropdownGeneral" class="nav-link dropdown-toggle text-dark fw-bold" href="#"
								role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
								v-pre>
								<!-- ログインしているユーザーの氏名を表示 -->
								<span sec:authentication="principal.user.name">一般ユーザー名</span>
							</a>

							<div class="dropdown-menu dropdown-menu-end border-0 shadow-sm"
								aria-labelledby="navbarDropdownGeneral">
								<!-- 【共通メニュー】 -->
								<a class="dropdown-item text-dark" th:href="@{/user}">会員基本情報</a>

								<div class="dropdown-divider"></div>

								<!-- 【有料会員（ROLE_PREMIUM）】 -->
								<div sec:authorize="hasRole('ROLE_PREMIUM')">
									<a class="dropdown-item text-dark" th:href="@{/reservations}">予約一覧・キャンセル</a>
									<a class="dropdown-item text-dark" th:href="@{/favorites}">お気に入り店舗一覧</a>
									<div class="dropdown-divider"></div>
									<form th:action="@{/subscription/portal}" method="post" class="m-0">
										<button type="submit"
											class="dropdown-item text-dark border-0 bg-transparent py-2 w-100 text-start">
											クレジットカード情報編集
										</button>
									</form>
									<form th:action="@{/subscription/portal}" method="post" class="m-0">
										<button type="submit"
											class="dropdown-item text-danger small border-0 bg-transparent py-2 w-100 text-start">
											有料会員の解約
										</button>
									</form>
								</div>

								<!-- 【無料会員（ROLE_FREE） -->
								<div sec:authorize="hasRole('ROLE_FREE')">
									<a class="dropdown-item text-warning fw-bold"
										th:href="@{/subscription/register}">有料会員登録（月額300円）</a>
								</div>

								<div class="dropdown-divider"></div>

								<!-- ログアウト -->
								<a class="dropdown-item text-dark" th:href="@{/logout}"
									onclick="event.preventDefault(); document.getElementById('user-logout-form').submit();">
									ログアウト
								</a>
								<form class="d-none" id="user-logout-form" th:action="@{/logout}" method="post"></form>
							</div>
						</li>

						<!-- 【管理者がログインしている時】 -->
						<li class="nav-item dropdown" sec:authorize="hasRole('ROLE_ADMIN')">
							<a id="navbarDropdownAdmin" class="nav-link dropdown-toggle text-dark fw-bold" href="#"
								role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
								v-pre>
								管理者メニュー
							</a>

							<div class="dropdown-menu dropdown-menu-end border-0 shadow-sm"
								aria-labelledby="navbarDropdownAdmin">
								<a class="dropdown-item text-dark" th:href="@{/admin/stores}">店舗一覧</a>
								<a class="dropdown-item text-dark" th:href="@{/admin/categories}">カテゴリ管理</a>
								<a class="dropdown-item text-dark" th:href="@{/admin/users}">会員管理</a>

								<div class="dropdown-divider"></div>

								<a class="dropdown-item text-dark" th:href="@{/admin/logout}"
									onclick="event.preventDefault(); document.getElementById('admin-logout-form').submit();">
									ログアウト
								</a>
								<form class="d-none" id="admin-logout-form" th:action="@{/admin/logout}" method="post">
								</form>
							</div>
						</li>
					</ul>
				</div>

			</div>
		</nav>
	</div>

	<!-- フッターの部品化 -->
	<div th:fragment="footer" th:remove="tag">
		<footer>
			<div class="d-flex justify-content-center align-items-center h-100">
				<p class="text-center text-muted small mb-0">&copy; NAGOYAMESHI All rights reserved.</p>
			</div>
		</footer>
	</div>

	<!-- script要素の部品化 -->
	<div th:fragment="scripts" th:remove="tag">
		<!-- Bootstrap -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
			crossorigin="anonymous"></script>
	</div>
</body>

</html>
