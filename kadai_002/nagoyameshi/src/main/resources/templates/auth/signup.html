<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
	<!-- meta要素の部品を呼び出す -->
	<div th:replace="~{fragment :: meta}"></div>

	<!-- スタイル部品を呼び出す -->
	<div th:replace="~{fragment :: styles}"></div>

	<title>会員登録 - NAGOYAMESHI</title>
</head>

<body>
	<div class="nagoyameshi-wrapper">
		<!-- ヘッダー -->
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container pt-5 pb-5 nagoyameshi-container">
				<div class="row justify-content-center">
					<div class="col-xl-5 col-lg-6 col-md-8">

						<h2 class="mb-4 text-center fw-bold text-dark">新規会員登録</h2>

						<!-- 会員登録フォーム -->
						<form method="post" th:action="@{/signup}" th:object="${signupForm}">

							<!-- 氏名入力欄 -->
							<div class="form-group row mb-3 text-dark">
								<div class="col-md-5">
									<label for="name" class="col-form-label text-md-left fw-bold small">
										<div class="d-flex align-items-center">
											<span class="me-1">氏名</span>
											<span class="badge bg-danger">必須</span>
										</div>
									</label>
								</div>
								<div class="col-md-7">
									<div th:if="${#fields.hasErrors('name')}" class="text-danger small mb-2"
										th:errors="*{name}"></div>
									<input type="text" class="form-control rounded" th:field="*{name}"
										autocomplete="name" autofocus placeholder="名古屋 太郎">
								</div>
							</div>

							<!-- フリガナ入力欄 -->
							<div class="form-group row mb-3 text-dark">
								<div class="col-md-5">
									<label for="furi" class="col-form-label text-md-left fw-bold small">
										<div class="d-flex align-items-center">
											<span class="me-1">フリガナ</span>
											<span class="badge bg-danger">必須</span>
										</div>
									</label>
								</div>
								<div class="col-md-7">
									<div th:if="${#fields.hasErrors('furi')}" class="text-danger small mb-2"
										th:errors="*{furi}"></div>
									<input type="text" class="form-control rounded" th:field="*{furi}"
										placeholder="ナゴヤ タロウ">
								</div>
							</div>

							<!-- メールアドレス入力欄 -->
							<div class="form-group row mb-3 text-dark">
								<div class="col-md-5">
									<label for="email" class="col-form-label text-md-left fw-bold small">
										<div class="d-flex align-items-center">
											<span class="me-1">メールアドレス</span>
											<span class="badge bg-danger">必須</span>
										</div>
									</label>
								</div>
								<div class="col-md-7">
									<div th:if="${#fields.hasErrors('email')}" class="text-danger small mb-2"
										th:errors="*{email}"></div>
									<input type="text" class="form-control rounded" th:field="*{email}"
										autocomplete="email" placeholder="nagoya@example.com">
								</div>
							</div>

							<!-- パスワード入力欄 -->
							<div class="form-group row mb-3 text-dark">
								<div class="col-md-5">
									<label for="password" class="col-form-label text-md-left fw-bold small">
										<div class="d-flex align-items-center">
											<span class="me-1">パスワード</span>
											<span class="badge bg-danger">必須</span>
										</div>
									</label>
								</div>
								<div class="col-md-7">
									<div th:if="${#fields.hasErrors('password')}" class="text-danger small mb-2"
										th:errors="*{password}"></div>
									<input type="password" class="form-control rounded" th:field="*{password}"
										autocomplete="new-password" placeholder="8文字以上">
								</div>
							</div>

							<!-- パスワード（確認用）入力欄 -->
							<div class="form-group row mb-4 text-dark">
								<div class="col-md-5">
									<label for="passwordConfirmation" class="col-form-label text-md-left fw-bold small">
										<div class="d-flex align-items-center">
											<span class="me-1">パスワード（確認用）</span>
											<span class="badge bg-danger">必須</span>
										</div>
									</label>
								</div>
								<div class="col-md-7">
									<div th:if="${#fields.hasErrors('passwordConfirmation')}"
										class="text-danger small mb-2" th:errors="*{passwordConfirmation}"></div>
									<input type="password" class="form-control rounded"
										th:field="*{passwordConfirmation}" autocomplete="new-password"
										placeholder="もう一度入力してください">
								</div>
							</div>

							<!-- 登録ボタン -->
							<div class="form-group d-flex justify-content-center mt-5 my-4">
								<button type="submit" class="btn btn-dark shadow-sm w-100 rounded fw-bold">登録</button>
							</div>
						</form>

						<!-- 案内リンク -->
						<div class="text-center">
							<a th:href="@{/login}" class="text-muted small">すでに会員登録がお済みの方はこちら</a>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!-- フッター部品を呼び出す -->
		<div th:replace="~{fragment :: footer}"></div>
	</div>

	<!-- JavaScript部品を呼び出す -->
	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
