<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<!-- meta要素の部品（meta）を呼び出す -->
	<div th:replace="~{fragment :: meta}"></div>
	<!-- Bootstrapなどのスタイル部品（styles）を呼び出す -->
	<div th:replace="~{fragment :: styles}"></div>

	<title>NAGOYAMESHI ADMIN</title>
</head>

<body>
	<div class="nagoyameshi-wrapper">
		<!-- ヘッダー部品（header）を呼び出す -->
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container nagoyameshi-container pb-5 pt-4">

				<div th:if="${successMessage}" class="alert alert-info text-center mb-4">
					<span th:text="${successMessage}"></span>
				</div>

				<!-- 店舗名 -->
				<h2 class="fw-bold mb-4 text-dark text-center">管理者 店舗一覧</h2>

				<!-- 新規店舗登録ボタン -->
				<div class="text-center mb-4">
					<a th:href="@{/admin/stores/register}"
						class="btn btn-dark btn-sm px-4 rounded-pill shadow-sm fw-bold">新しく店舗を登録する</a>
				</div>

				<!-- 店舗名キーワード検索窓 -->
				<div class="row mb-4 justify-content-start">
					<div class="col-md-5">
						<form method="get" th:action="@{/admin/stores}">
							<div class="input-group input-group-lg shadow-sm rounded">
								<input type="text" name="keyword" th:value="${keyword}"
									class="form-control border-0 px-3 text-dark" placeholder="店名で検索">
								<button class="btn btn-dark border-0 px-3" type="submit">検索</button>
							</div>
						</form>
					</div>
				</div>

				<div class="row justify-content-center">

					<!-- 会員データが空ではない場合 -->
					<div th:unless="${storePage.isEmpty()}"
						class="table-responsive bg-white rounded shadow-sm p-4 mb-4">
						<table class="table table-hover align-middle">
							<thead class="table-light">
								<tr class="text-dark">
									<th scope="col" class="fw-bold small">ID</th>
									<th scope="col" class="fw-bold small">店舗名</th>
									<th scope="col" class="fw-bold small">郵便番号</th>
									<th scope="col" class="fw-bold small">住所</th>
									<th scope="col" class="fw-bold small">電話番号</th>
									<th scope="col" class="fw-bold small">登録日</th>
									<th scope="col" class="fw-bold small">操作</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="store : ${storePage.content}" class="text-secondary small">
									<!-- ID -->
									<td th:text="${store.id}" class="fw-bold text-dark"></td>
									<!-- 店舗名 -->
									<td>
										<a th:href="@{/admin/stores/{storeId}(storeId=${store.id})}"
											class="link-dark text-decoration-none fw-bold th-hover-link"
											th:text="${store.name}">店舗名</a>
									</td>
									<!-- 郵便番号 -->
									<td th:text="${store.postalCode}"></td>
									<!-- 住所 -->
									<td th:text="${store.address}"></td>
									<!-- 電話番号 -->
									<td th:text="${store.phoneNumber}"></td>
									<!-- 登録日 -->
									<td th:text="${#dates.format(store.createdAt, 'yyyy年MM月dd日')}">2026年01/01日</td>
									<!-- 編集・削除 -->
									<td>
										<!-- 編集ボタン -->
										<a th:href="@{/admin/stores/{storeId}/edit(storeId=${store.id})}"
											class="btn btn-link p-0 text-decoration-none small"
											style="font-size: 0.8rem;">編集</a>

										<!-- 削除ボタン -->
										<a href="#" class="btn btn-link p-0 text-decoration-none small text-danger"
											style="font-size: 0.8rem;" data-bs-toggle="modal"
											th:data-bs-target="${'#deleteStoreModal' + store.id}">削除</a>
									</td>
								</tr>
							</tbody>
						</table>
						<th:block th:each="store : ${storePage.content}">
							<!-- 削除確認用モーダル -->
							<div class="modal fade" th:id="${'deleteStoreModal' + store.id}" tabindex="-1"
								aria-hidden="true">
								<div class="modal-dialog modal-dialog-centered">
									<div class="modal-content">

										<!-- モーダルのヘッダー（タイトル） -->
										<div class="modal-header">
											<h5 class="modal-title fw-bold">店舗削除確認</h5>
											<button type="button" class="btn-close" data-bs-dismiss="modal"
												aria-label="閉じる"></button>
										</div>

										<!-- モーダルの本文（確認メッセージ） -->
										<div class="modal-body text-start">
											<p class="mb-0 small text-secondary">以下の店舗情報を完全に削除しますか？この操作は取り消せません。
											</p>
											<p class="fw-bold text-dark" th:text="${store.name}"></p>
										</div>

										<!-- モーダルのフッター（キャンセルと本当に削除するボタン） -->
										<div class="modal-footer">
											<button type="button" class="btn btn-secondary btn-sm rounded-pill px-3"
												data-bs-dismiss="modal">キャンセル</button>

											<form th:action="@{/admin/stores/{storeId}/delete(storeId=${store.id})}"
												method="post">
												<button type="submit"
													class="btn btn-dark btn-sm rounded-pill px-3">本当に削除する</button>
											</form>
										</div>

									</div>
								</div>
							</div>
						</th:block>
					</div>

					<div th:if="${storePage.isEmpty()}" class="card shadow-sm border-0 bg-white mb-4">
						<div class="card-body p-5 text-center">
							<p class="text-secondary mb-0 small lh-base">該当する情報が見つかりませんでした。</p>
						</div>
					</div>


					<!-- ページネーション -->
					<div th:if="${storePage.getTotalPages() > 1}" class="d-flex justify-content-center mt-4">
						<nav aria-label="レビュー 一覧ページ">
							<ul class="pagination">

								<!-- 「前」への戻るボタン -->
								<li class="page-item">
									<span th:if="${storePage.isFirst()}"
										class="page-link disabled text-muted border-0">前</span>
									<a th:unless="${storePage.isFirst()}"
										th:href="@{/admin/stores(page=${storePage.getNumber() - 1}, keyword = ${keyword})}"
										class="page-link btn-dark border-0">前</a>
								</li>

								<!-- 各ページ移動 -->
								<li th:each="i : ${#numbers.sequence(0, storePage.getTotalPages() - 1)}"
									class="page-item mx-1">
									<!-- 現在アクティブなページ番号 -->
									<span th:if="${i == storePage.getNumber()}"
										class="page-link bg-dark text-white border-0 rounded"
										th:text="${i + 1}">1</span>
									<!-- それ以外のページ番号へのリンク -->
									<a th:unless="${i == storePage.getNumber()}"
										th:href="@{/admin/stores(page = ${i}, keyword = ${keyword})}"
										class="page-link text-dark border-0 rounded" th:text="${i + 1}">2</a>
								</li>

								<!-- 「次」への進むボタン -->
								<li class="page-item">
									<span th:if="${storePage.isLast()}"
										class="page-link disabled text-muted border-0">次</span>
									<a th:unless="${storePage.isLast()}"
										th:href="@{/admin/stores(page=${storePage.getNumber() + 1}, keyword = ${keyword})}"
										class="page-link btn-dark border-0">次</a>
								</li>
							</ul>
						</nav>
					</div> <!-- ページネーション閉じタグ -->


				</div>
			</div>
		</main>
		<!-- フッター部品（footer）を呼び出す -->
		<div th:replace="~{fragment :: footer}"></div>
	</div>
	<!-- BootstrapのJavaScript部品（scripts）を呼び出す -->
	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
